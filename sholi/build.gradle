buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.2'
    }
}
apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation('de.greenrobot:greendao:1.3.7')
    implementation('androidx.security:security-crypto:1.1.0-alpha06')
}

android {
    compileSdkVersion 19

    lintOptions {
        abortOnError false
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src-gen/main/java']
        }
    }
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 19
    }
    buildTypes {
        release {
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    flavorDimensions "default"
    productFlavors {
        defaultFlavor {
            proguardFile 'proguard-rules.txt'
        }
    }
}

task verifyStory7MinSdk {
    doLast {
        def configuredMinSdk = android.defaultConfig.minSdkVersion.apiLevel
        if (configuredMinSdk != 23) {
            throw new GradleException("Expected story #7 minSdkVersion 23 but was ${configuredMinSdk}")
        }
    }
}

gradle.projectsEvaluated {
    preBuild.dependsOn(':sholimodelgenerator:generate')
}
