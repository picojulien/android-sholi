apply plugin: 'java'
apply plugin: 'maven'
apply plugin:'application'

group = 'name.soulayrol.rhaa'
version = '2.0.0'
sourceCompatibility = 1.8
mainClassName = "name.soulayrol.rhaa.sholi.model.Generator"

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation('de.greenrobot:greendao-generator:1.3.0')
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

artifacts {
    archives jar
}

task copyToLib(type: Copy) {
    into "$buildDir/libs"
    from configurations.runtimeClasspath
}

task generate(type: JavaExec) {
    mainClass = "name.soulayrol.rhaa.sholi.model.Generator"
    classpath = configurations.runtimeClasspath + files("build/libs/${project.name}-${version}.jar")
}
generate.dependsOn build
